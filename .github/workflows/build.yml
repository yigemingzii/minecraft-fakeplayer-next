name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

env:
  REVISION: 0.4.4

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Restore Maven dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/spigotmc
            !~/.m2/repository/io/github/hello09x/fakeplayer
          key: maven-dependencies-${{ runner.os }}-v1

      - name: Restore Spigot remapped dependency cache
        id: spigot-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: spigot-remapped-${{ runner.os }}-v2-1.20.1-1.20.2-1.20.4-1.20.6-1.21.1-1.21.3-1.21.4-1.21.5-1.21.6-1.21.8-1.21.10-1.21.11
          restore-keys: |
            spigot-remapped-${{ runner.os }}-v2-

      - name: Verify cached spigot remapped-mojang dependencies
        if: steps.spigot-cache.outputs.cache-hit == 'true'
        run: |
          for version in 1.20.1 1.20.2 1.20.4 1.20.6 1.21.1 1.21.3 1.21.4 1.21.5 1.21.6 1.21.8 1.21.10 1.21.11; do
            snapshot="R0.1-SNAPSHOT"
            [ "$version" = "1.21.11" ] && snapshot="R0.2-SNAPSHOT"
            JAR="$HOME/.m2/repository/org/spigotmc/spigot/$version-$snapshot/spigot-$version-$snapshot-remapped-mojang.jar"
            test -f "$JAR" || { echo "Cached dependency is missing: $JAR" >&2; exit 1; }
          done

      - name: Download BuildTools
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: curl -sL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar

      - name: Build missing spigot remapped-mojang dependencies
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        run: |
          build_spigot() {
            version="$1"
            snapshot="R0.1-SNAPSHOT"
            [ "$version" = "1.21.11" ] && snapshot="R0.2-SNAPSHOT"
            D="$HOME/.m2/repository/org/spigotmc/spigot/$version-$snapshot"
            JAR="$D/spigot-$version-$snapshot-remapped-mojang.jar"
            if [ -f "$JAR" ]; then
              echo "[skip] spigot $version (cached)"
              return
            fi

            echo "[build] spigot $version"
            rm -f "$D"/*.lastUpdated
            work="$RUNNER_TEMP/buildtools-$version"
            mkdir -p "$work"
            (
              cd "$work"
              java -jar "$GITHUB_WORKSPACE/BuildTools.jar" --rev "$version" --remapped
            )
            test -f "$JAR" || { echo "BuildTools did not install $JAR" >&2; exit 1; }
          }
          export -f build_spigot
          printf '%s\n' 1.20.1 1.20.2 1.20.4 1.20.6 1.21.1 1.21.3 1.21.4 1.21.5 1.21.6 1.21.8 1.21.10 1.21.11 \
            | xargs -n 1 -P 3 bash -c 'build_spigot "$1"' _

      - name: Save Spigot remapped dependency cache
        if: steps.spigot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/spigotmc
          key: ${{ steps.spigot-cache.outputs.cache-primary-key }}

      - name: Install JDK 25
        run: |
          if [ ! -d /opt/jdk-25 ]; then
            curl -sL "https://api.azul.com/metadata/v1/zulu/packages/?java_version=25&os=linux&arch=x86_64&latest=true" \
              | grep -o '"download_url":"[^"]*jdk[^"]*linux_x64[^"]*tar\.gz"' | head -1 | cut -d'"' -f4 | xargs curl -sL -o zulu25.tar.gz
            mkdir -p /opt/jdk-25
            tar -xzf zulu25.tar.gz -C /opt/jdk-25 --strip-components=1
          fi
          echo "JDK25_HOME=/opt/jdk-25" >> $GITHUB_ENV

      - name: Prepare dependencies
        run: |
          mkdir -p lib versions/26.1.2 versions/26.2
          if [ ! -f versions/26.1.2/paper-26.1.2.jar ]; then
            curl -sL -o lib/paper-26.1.2-server.jar \
              "https://fill-data.papermc.io/v1/objects/1d70b1dab9cf4a6de615209a536f3a45a2186240253c428213ce2188ab95e5f7/paper-26.1.2-74.jar"
            $JDK25_HOME/bin/java -jar lib/paper-26.1.2-server.jar --help || true
          fi
          if [ ! -f versions/26.2/paper-26.2.jar ]; then
            curl -sL -o lib/paper-26.2-server.jar \
              "https://fill-data.papermc.io/v1/objects/825963b3c22103c7501382d5d365b960a830e3f9c79d9aa2b06f32ad1a98659f/paper-26.2-68.jar"
            $JDK25_HOME/bin/java -jar lib/paper-26.2-server.jar --help || true
          fi
          test -f versions/26.1.2/paper-26.1.2.jar
          test -f versions/26.2/paper-26.2.jar
          [ -f lib/OpenInv.jar ] || curl -sL -o lib/OpenInv.jar \
            "https://cdn.modrinth.com/data/1UlvXbzL/versions/eRnnClIe/OpenInv.jar"
          [ -f lib/PlaceholderAPI-2.11.6.jar ] || curl -sL -o lib/PlaceholderAPI-2.11.6.jar \
            "https://cdn.modrinth.com/data/lKEzGugV/versions/vkuwyUC6/PlaceholderAPI-2.11.6.jar"

      - name: Install 1.20.x / 1.21.x modules (JDK 21)
        run: |
          MODULES="fakeplayer-v1_20_1,fakeplayer-v1_20_2,fakeplayer-v1_20_3,fakeplayer-v1_20_4,fakeplayer-v1_20_5,fakeplayer-v1_20_6,"
          MODULES="$MODULES fakeplayer-v1_21,fakeplayer-v1_21_1,fakeplayer-v1_21_3,fakeplayer-v1_21_4,fakeplayer-v1_21_5,"
          MODULES="$MODULES fakeplayer-v1_21_6,fakeplayer-v1_21_7,fakeplayer-v1_21_8,fakeplayer-v1_21_9,fakeplayer-v1_21_10,fakeplayer-v1_21_11"
          MODULES=$(echo "$MODULES" | tr -d ' ')
          mvn install -pl "$MODULES" -am -Drevision=${{ env.REVISION }} -DskipTests --no-transfer-progress

      - name: Install 26.x modules (JDK 25)
        run: |
          export JAVA_HOME=$JDK25_HOME
          mvn install -pl fakeplayer-v26_1_2,fakeplayer-v26_2 -Drevision=${{ env.REVISION }} -DskipTests --no-transfer-progress

      - name: Package final jar (shade)
        run: |
          mvn package -pl fakeplayer-dist -Drevision=${{ env.REVISION }} -DskipTests --no-transfer-progress

      - name: Verify final jar contents
        run: |
          JAR="target/fakeplayer-${REVISION}.jar"
          test -f "$JAR"
          jar tf "$JAR" > target/fakeplayer-contents.txt
          for entry in \
            io/github/hello09x/devtools/core/utils/Exceptions.class \
            com/google/inject/Guice.class \
            com/zaxxer/hikari/HikariDataSource.class \
            io/github/hello09x/fakeplayer/core/gui/FakeplayerGui.class \
            io/github/hello09x/fakeplayer/v1_21_10/spi/NMSBridgeImpl.class \
            io/github/hello09x/fakeplayer/v1_21_11/spi/NMSBridgeImpl.class \
            io/github/hello09x/fakeplayer/v26_1_2/spi/NMSBridgeImpl.class \
            io/github/hello09x/fakeplayer/v26_2/spi/NMSBridgeImpl.class \
            message/message.properties \
            message/message_zh.properties \
            META-INF/LICENSE.txt \
            META-INF/NOTICE; do
            grep -Fxq "$entry" target/fakeplayer-contents.txt || {
              echo "Missing required class in final jar: $entry" >&2
              exit 1
            }
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fakeplayer-${{ env.REVISION }}
          path: target/fakeplayer-${{ env.REVISION }}.jar
          if-no-files-found: error
